<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TuxOS login v3</title>
<style>
:root {
  --accent: #8fb8ff;
  --accent-deep: #5b8def;
  --text: #f4f7fb;
  --muted: #8b95a5;
  --line: rgba(200, 220, 255, 0.10);
  --ui: "Adwaita Sans", "Noto Sans", sans-serif;
  --mono: "JetBrainsMono NF", "JetBrainsMono Nerd Font", monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
body { font-family: var(--ui); color: var(--text); }

.bg {
  position: absolute; inset: -80px;
  background: url("wallpaper.png") center / cover;
  filter: blur(36px) brightness(0.72);
}
.glow { position: absolute; inset: 0; background: radial-gradient(1100px 700px at 50% 30%, rgba(120, 165, 255, 0.07), transparent 70%); }
.vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.5) 100%); }

.card {
  position: absolute; left: 50%; top: 50%;
  width: 1040px; height: 500px; transform: translate(-50%, -50%);
  background: rgba(10, 12, 16, 0.42);
  border: 1px solid rgba(210, 225, 255, 0.10);
  border-radius: 40px;
  box-shadow: 0 40px 120px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.035);
  backdrop-filter: blur(40px);
  display: grid; grid-template-columns: 1fr 1px 1fr; align-items: center;
}
.divider { height: 300px; background: var(--line); }

.left { padding-left: 84px; }
.time { font-size: 150px; font-weight: 700; letter-spacing: -6px; line-height: 0.9; }
.time span { color: var(--accent); }
.date { margin-top: 22px; font-size: 20px; color: var(--muted); letter-spacing: 0.3px; }

.right { display: flex; flex-direction: column; align-items: center; }
.avatar {
  width: 112px; height: 112px; border-radius: 50%;
  background: radial-gradient(circle at 50% 40%, #232a36, #0b0d11);
  box-shadow: 0 0 0 2px var(--accent), 0 0 30px rgba(143, 184, 255, 0.18);
  display: grid; place-items: center; overflow: hidden;
}
.avatar img { width: 74px; margin-top: 6px; }
.name { margin-top: 20px; font-size: 22px; font-weight: 500; }
.pass {
  margin-top: 28px; width: 340px; height: 52px; border-radius: 26px;
  background: rgba(0,0,0,0.30);
  border: 1px solid rgba(143,184,255,0.55);
  display: flex; align-items: center; padding: 0 6px 0 22px;
}
.pass .dots { flex: 1; font-size: 20px; letter-spacing: 6px; }
.pass .dots::after { content: ""; display: inline-block; width: 2px; height: 20px; background: var(--accent); vertical-align: -3px; margin-left: 4px; }
.pass .go { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #0b1424; display: grid; place-items: center; font-family: var(--mono); font-size: 16px; }

.corner { position: absolute; bottom: 26px; right: 30px; display: flex; gap: 6px; }
.corner i {
  font-style: normal; font-family: var(--mono); font-size: 17px; color: var(--muted);
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
}
.session { position: absolute; bottom: 26px; left: 30px; font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 8px; }
.session i { font-style: normal; font-family: var(--mono); font-size: 11px; }
</style>
</head>
<body>
<div class="bg"></div><div class="glow"></div><div class="vignette"></div>

<div class="card">
  <div class="left">
    <div class="time">18<span>:</span>07</div>
    <div class="date">Saturday, 7 November</div>
  </div>
  <div class="divider"></div>
  <div class="right">
    <div class="avatar"><img src="../../branding/out/pixmaps/tuxos-logo.png" alt=""></div>
    <div class="name">Tux Tester</div>
    <div class="pass"><span class="dots">••••••</span><span class="go">&#xf061;</span></div>
  </div>

  <div class="session">TuxOS desktop <i>&#xf078;</i></div>
  <div class="corner"><i>&#xf0904;</i><i>&#xf021;</i><i>&#xf011;</i></div>
</div>
</body>
</html>
