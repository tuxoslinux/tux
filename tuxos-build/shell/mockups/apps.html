<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TuxOS apps</title>
<!-- one app per URL hash, e.g. apps.html#settings -->
<style>
:root {
  --accent: #8fb8ff; --accent2: #5b8def; --text: #f4f7fb; --muted: #8b95a5; --dim: #4c5463;
  --line: rgba(200, 220, 255, 0.10); --glass-tint: rgba(10, 12, 16, 0.62); --glass-line: rgba(210, 225, 255, 0.10);
  --ok: #7fd1a0; --warn: #ffc56b; --bad: #ff7a8a;
  --ui: "Adwaita Sans", "Noto Sans", sans-serif; --mono: "JetBrainsMono NF", "JetBrainsMono Nerd Font", monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
body { font-family: var(--ui); color: var(--text); font-size: 14px; }
i { font-style: normal; font-family: var(--mono); }
.bg { position: absolute; inset: 0; background: url("wallpaper.png") center / cover; }
.gb { position: absolute; inset: 0; overflow: hidden; z-index: -1; border-radius: inherit; }
.gb div { position: absolute; width: 1920px; height: 1080px; background: url("wallpaper.png") center / cover; filter: blur(34px) brightness(0.9); }
.gb::after { content: ""; position: absolute; inset: 0; background: var(--glass-tint); }
.glass { position: relative; isolation: isolate; border: 1px solid var(--glass-line); box-shadow: 0 30px 90px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.035); }

/* bar + dock (as approved) */
.bar { position: absolute; left: 12px; right: 12px; top: 10px; height: 46px; border-radius: 16px; z-index: 5;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 8px; }
.bar .l, .bar .r { display: flex; align-items: center; gap: 6px; } .bar .r { justify-content: flex-end; }
.bar .logo { width: 34px; display: grid; place-items: center; } .bar .logo img { width: 22px; }
.ws { display: flex; gap: 4px; margin-left: 6px; padding: 4px; border-radius: 12px; background: rgba(255,255,255,0.04); }
.ws span { width: 30px; height: 26px; border-radius: 9px; display: grid; place-items: center; font-size: 13px; font-weight: 600; color: var(--dim); }
.ws span.u { color: var(--text); } .ws span.on { width: 44px; background: var(--accent); color: #0b1424; }
.clock { font-size: 15px; font-weight: 600; } .clock span { color: var(--muted); font-weight: 500; margin-left: 10px; }
.mid { display: flex; align-items: center; gap: 8px; }
.chip { display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 14px 0 12px; border-radius: 11px; background: rgba(143,184,255,0.10); box-shadow: inset 0 0 0 1px rgba(143,184,255,0.22); }
.chip i { color: var(--accent); } .chip .s { color: var(--muted); font-size: 13px; }
.bar .r i { font-size: 16px; min-width: 30px; text-align: center; }
.bar .grp { display: flex; align-items: center; gap: 2px; padding: 0 8px; height: 34px; border-radius: 11px; background: rgba(255,255,255,0.04); }
.bar .grp b { font-size: 13px; color: var(--muted); font-weight: 500; }
.dock { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 5; display: flex; align-items: center; gap: 10px; padding: 10px 12px 14px; border-radius: 26px; }
.tile { position: relative; width: 58px; height: 58px; border-radius: 17px; display: grid; place-items: center; font-family: var(--mono); font-size: 27px; color: var(--text);
  background: linear-gradient(160deg, rgba(255,255,255,0.17), rgba(255,255,255,0.06)); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), inset 0 0 0 1px rgba(255,255,255,0.05), 0 4px 12px rgba(0,0,0,0.3); }
.tile.run::after, .tile.foc::after { content: ""; position: absolute; bottom: -10px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: rgba(244,247,251,0.7); }
.tile.foc::after { width: 16px; margin-left: -8px; border-radius: 3px; background: var(--accent); }
.dsep { width: 1px; height: 40px; background: var(--glass-line); }

/* app window */
.win { position: absolute; z-index: 4; left: 230px; top: 80px; width: 1460px; height: 860px; border-radius: 24px; display: none; overflow: hidden; }
.win.on { display: flex; flex-direction: column; }
.tb { height: 52px; flex: none; display: flex; align-items: center; padding: 0 14px 0 20px; gap: 12px; border-bottom: 1px solid var(--line); }
.tb .ap { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-family: var(--mono); font-size: 15px; background: linear-gradient(160deg, rgba(255,255,255,0.18), rgba(255,255,255,0.06)); }
.tb .t { font-size: 14.5px; font-weight: 600; }
.tb .sub { color: var(--muted); font-size: 13.5px; }
.tb .sp { flex: 1; }
.wc { display: flex; gap: 8px; } .wc i { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; color: var(--muted); background: rgba(255,255,255,0.06); }
.wc i.x:hover { background: var(--bad); }
.tsearch { width: 340px; height: 34px; border-radius: 11px; background: rgba(0,0,0,0.25); border: 1px solid var(--line); display: flex; align-items: center; gap: 10px; padding: 0 12px; color: var(--muted); font-size: 13.5px; }
.tsearch i { color: var(--muted); }
.body { flex: 1; display: flex; min-height: 0; }
.side { width: 250px; flex: none; padding: 14px 12px; border-right: 1px solid var(--line); overflow: hidden; }
.side .grp { font-size: 11.5px; letter-spacing: 1.3px; text-transform: uppercase; color: var(--dim); font-weight: 700; margin: 16px 10px 8px; }
.side .grp:first-child { margin-top: 4px; }
.nav { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 12px; color: #d6dce6; font-size: 14px; }
.nav i { width: 20px; text-align: center; color: var(--muted); font-size: 15px; }
.nav.on { background: rgba(143,184,255,0.14); box-shadow: inset 0 0 0 1px rgba(143,184,255,0.28); color: var(--text); }
.nav.on i { color: var(--accent); }
.nav .n { margin-left: auto; font-size: 12px; color: var(--muted); }
.main { flex: 1; padding: 26px 30px; overflow: hidden; min-width: 0; }
h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.4px; }
h1 + .lead { color: var(--muted); margin-top: 6px; font-size: 14.5px; }
h2 { font-size: 13px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--dim); font-weight: 700; margin: 26px 0 12px; }
.card { background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 20px; padding: 18px 20px; }
.row { display: flex; align-items: center; gap: 14px; padding: 14px 4px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .k { font-size: 14.5px; } .row .d { font-size: 12.5px; color: var(--muted); margin-top: 3px; } .row .v { margin-left: auto; color: var(--muted); font-size: 13.5px; }
.tg { width: 42px; height: 24px; border-radius: 12px; background: rgba(255,255,255,0.12); position: relative; margin-left: auto; flex: none; }
.tg::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #c6cfdb; }
.tg.on { background: var(--accent); } .tg.on::after { left: auto; right: 3px; background: #0b1424; }
.seg { display: inline-flex; gap: 3px; padding: 3px; border-radius: 12px; background: rgba(255,255,255,0.05); margin-left: auto; }
.seg span { padding: 7px 14px; border-radius: 9px; font-size: 13px; color: var(--muted); }
.seg span.on { background: var(--accent); color: #0b1424; font-weight: 600; }
.sl { width: 260px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.1); position: relative; margin-left: auto; }
.sl div { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--accent); }
.sl div::after { content: ""; position: absolute; right: -8px; top: -5px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 600; background: rgba(255,255,255,0.07); border: 1px solid var(--line); }
.btn.p { background: var(--accent); color: #0b1424; border-color: transparent; }
.btn i { font-size: 14px; }
.grid { display: grid; gap: 16px; }
.big { font-size: 34px; font-weight: 700; letter-spacing: -1px; }
.mut { color: var(--muted); } .dimc { color: var(--dim); } .acc { color: var(--accent); } .okc { color: var(--ok); }
.pill { display: inline-block; padding: 3px 9px; border-radius: 8px; font-size: 12px; background: rgba(143,184,255,0.14); color: var(--accent); }
svg.g { display: block; width: 100%; }
.small { font-size: 12.5px; }
.ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-family: var(--mono); font-size: 18px; flex: none;
  background: linear-gradient(160deg, rgba(255,255,255,0.17), rgba(255,255,255,0.06)); box-shadow: inset 0 1px 0 rgba(255,255,255,0.15); }
.ic.a { background: var(--accent); color: #0b1424; box-shadow: none; }
.menu { position: absolute; z-index: 9; width: 230px; padding: 6px; border-radius: 16px; }
.menu div { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 10px; font-size: 14px; }
.menu div i { width: 18px; color: var(--muted); text-align: center; }
.menu div.on { background: rgba(143,184,255,0.14); } .menu div.red { color: var(--bad); } .menu div.red i { color: var(--bad); }
.menu hr { border: 0; height: 1px; background: var(--line); margin: 5px 6px; }
.cursor { position: absolute; z-index: 10; width: 22px; height: 30px; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.6)); }
.full { position: absolute; inset: 0; z-index: 8; display: none; }
.full.on { display: block; }
</style>
</head>
<body>
<div class="bg"></div>

<div class="bar glass"><div class="l"><div class="logo"><img src="../../branding/out/pixmaps/tuxos-logo.png" alt=""></div><div class="ws"><span class="u">1</span><span class="on">2</span><span class="u">3</span><span>4</span><span>5</span></div></div>
  <div class="mid"><div class="clock">18:07<span>Sat 7 Nov</span></div><div class="chip" id="chip" style="display:none"></div></div>
  <div class="r"><i>&#xf0297;</i><div class="grp"><i>&#xf05a9;</i><i>&#xf057e;</i><i>&#xf0079;</i><b>86%</b></div><i class="mut">&#xf011;</i></div></div>
<div class="dock glass" id="dock"></div>
<div id="stage"></div>

<script>
const app = (location.hash || '#settings').slice(1);
const $ = s => document.querySelector(s);
const ico = c => `&#x${c};`;
// graphs -------------------------------------------------------------------
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function series(n, base, amp, s) { seed = s; let v = base, out = []; for (let k = 0; k < n; k++) { v += (rnd() - 0.5) * amp; v = Math.max(2, Math.min(98, v)); out.push(v); } return out; }
function graph(w, h, data, color = '#8fb8ff', fill = true, grid = true) {
  const n = data.length, step = w / (n - 1);
  const pts = data.map((v, k) => [k * step, h - (v / 100) * h]);
  let d = `M ${pts[0][0]} ${pts[0][1]}`;
  for (let k = 1; k < n; k++) { const [x0, y0] = pts[k - 1], [x1, y1] = pts[k]; const cx = (x0 + x1) / 2; d += ` C ${cx} ${y0}, ${cx} ${y1}, ${x1} ${y1}`; }
  const id = 'g' + Math.round(rnd() * 1e9);
  let gl = '';
  if (grid) for (let k = 1; k < 4; k++) gl += `<line x1="0" x2="${w}" y1="${h * k / 4}" y2="${h * k / 4}" stroke="rgba(255,255,255,0.05)"/>`;
  return `<svg class="g" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="height:${h}px"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity="0.35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${gl}${fill ? `<path d="${d} L ${w} ${h} L 0 ${h} Z" fill="url(#${id})"/>` : ''}<path d="${d}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
// window frame ---------------------------------------------------------------
function win(o) {
  const st = o.style || '';
  return `<div class="win glass on" style="${st}">
    <div class="tb"><div class="ap">${ico(o.icon)}</div><div class="t">${o.title}</div>${o.sub ? `<div class="sub">${o.sub}</div>` : ''}<div class="sp"></div>${o.tools || ''}
      <div class="wc"><i>${ico('f2d1')}</i><i>${ico('f2d0')}</i><i class="x">${ico('f00d')}</i></div></div>
    <div class="body">${o.side ? `<div class="side">${o.side}</div>` : ''}<div class="main" style="${o.mainStyle || ''}">${o.main}</div></div></div>`;
}
const nav = (items, on) => items.map(([g, c, t, n]) => g === 'grp' ? `<div class="grp">${c}</div>` : `<div class="nav${t === on ? ' on' : ''}"><i>${ico(c)}</i>${t}${n ? `<span class="n">${n}</span>` : ''}</div>`).join('');
const N = (c, t, n) => ['', c, t, n]; const G = t => ['grp', t];
const row = (k, d, right) => `<div class="row"><div><div class="k">${k}</div>${d ? `<div class="d">${d}</div>` : ''}</div>${right}</div>`;
const tg = on => `<div class="tg${on ? ' on' : ''}"></div>`;
const seg = (opts, on) => `<div class="seg">${opts.map(x => `<span class="${x === on ? 'on' : ''}">${x}</span>`).join('')}</div>`;
const sl = p => `<div class="sl"><div style="width:${p}%"></div></div>`;
const cursorAt = (x, y) => `<svg class="cursor" style="left:${x}px;top:${y}px" viewBox="0 0 22 30"><path d="M2 2 L2 24 L8 18.5 L12 28 L16 26.3 L12 17 L20 17 Z" fill="#fff" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/></svg>`;

const A = {};
// 1. Settings: Appearance -------------------------------------------------------
const setNav = [G('System'), N('f1eb','Wi-Fi & network'), N('f293','Bluetooth'), N('f108','Displays'), N('f028','Sound'), N('f240','Power & battery'),
  G('Personal'), N('f1fc','Appearance'), N('f009','Desktop & dock'), N('f0f3','Notifications'), N('f11c','Keyboard & shortcuts'), N('f0c9','Default apps'),
  G('TuxOS'), N('f11b','Gaming'), N('f0e4','Performance'), N('f019','Updates & drivers', '3'), N('f132','Privacy & security'), N('f0c0','Users'), N('f05a','About')];
A.settings = () => win({ icon: 'f0493', title: 'Settings', tools: `<div class="tsearch"><i>${ico('f002')}</i>Search all settings</div>`,
  side: nav(setNav, 'Appearance'),
  main: `<h1>Appearance</h1><div class="lead">Wallpaper, colours and how the shell looks and moves.</div>
  <h2>Wallpaper</h2><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:14px">
    ${[0,1,2,3,4].map(k => `<div style="height:120px;border-radius:16px;${k===0?'box-shadow:0 0 0 3px #8fb8ff;':''}background:${k===0?'url(wallpaper.png) center/cover':['','linear-gradient(135deg,#1b2740,#0b0f18)','radial-gradient(circle at 30% 30%,#5b8def,#0b0f18 70%)','linear-gradient(160deg,#cfd8e6,#5e6a80)','linear-gradient(180deg,#2b3f66,#6f86b4 50%,#151922)'][k]}"></div>`).join('')}</div>
  <h2>Accent colour</h2><div style="display:flex;gap:14px;align-items:center">${['#8fb8ff','#9be0c8','#c4b5fd','#f4a7b9','#ffd28a','#e9edf3'].map((c,k)=>`<div style="width:38px;height:38px;border-radius:50%;background:${c};${k===0?'box-shadow:0 0 0 3px #0b0e14,0 0 0 5px #8fb8ff':''}"></div>`).join('')}<span class="mut small" style="margin-left:10px">Blue is the TuxOS default</span></div>
  <h2>Shell</h2><div class="card" style="padding:4px 20px">
    ${row('Glass', 'How strongly panels blur what is behind them', sl(70))}
    ${row('Bar', 'Floating or attached to the screen edge', seg(['Floating','Attached'],'Floating'))}
    ${row('Corner roundness', '', seg(['Small','Medium','Large'],'Large'))}
    ${row('Animations', 'Droplets, window motion, unlock', tg(true))}
    ${row('Smart app symbols', 'One-colour symbols chosen from what each app is', tg(true))}
    ${row('Text size', '', seg(['Small','Default','Large','Larger'],'Default'))}</div>` });
// 2. System manager: overview ----------------------------------------------------
A.sysmon = () => {
  const core = k => { const d = series(30, 20 + (k * 13) % 50, 22, 11 + k); const now = Math.round(d[d.length - 1]);
    return `<div style="background:rgba(255,255,255,0.03);border:1px solid var(--line);border-radius:12px;padding:8px 10px 6px"><div style="display:flex;font-size:11.5px"><span class="mut">${k < 16 ? 'P' : 'E'}${k}</span><span style="margin-left:auto">${now}%</span></div>${graph(140, 34, d, '#8fb8ff', true, false)}</div>`; };
  const stat = (k, v) => `<div><div class="small mut">${k}</div><div style="font-size:17px;font-weight:600;margin-top:3px">${v}</div></div>`;
  return win({ icon: 'f0e4', title: 'System manager', tools: `<div class="tsearch"><i>${ico('f002')}</i>Search processes</div>`,
    side: nav([N('f009','Overview'), N('f03a','Processes','214'), N('f2db','CPU'), N('f233','Memory'), N('f0a0','Disks'), N('f1eb','Network'), N('f26c','GPU'), G('TuxOS'), N('f085','Services','dinit'), N('f135','Startup apps')], 'CPU'),
    main: `<div style="display:flex;align-items:flex-end;gap:30px"><div><h1>Intel Core i7-14700K</h1><div class="lead">20 cores, 28 threads · x86-64-v3 packages</div></div>
      <div style="margin-left:auto;display:flex;gap:34px">${stat('Usage','23%')}${stat('Speed','5.32 GHz')}${stat('Temperature','54 °C')}${stat('Power','68 W')}${stat('Voltage','1.21 V')}</div></div>
      <div class="card" style="margin-top:20px;padding:16px 18px 10px"><div style="display:flex;font-size:13px"><span>All cores</span><span class="mut" style="margin-left:auto">last 60 s</span></div>${graph(1100, 150, series(60, 25, 16, 3))}</div>
      <h2>Per core</h2><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:10px">${Array.from({length: 28}, (_, k) => core(k)).join('')}</div>` });
};
// 3. System manager: overview cards (RAM, disk, network, GPU) -----------------
A.sysmon2 = () => {
  const card = (ic, t, sub, body) => `<div class="card"><div style="display:flex;align-items:center;gap:12px"><div class="ic">${ico(ic)}</div><div><div style="font-weight:600;font-size:15px">${t}</div><div class="small mut">${sub}</div></div></div>${body}</div>`;
  const kv = arr => `<div style="display:grid;grid-template-columns:repeat(${arr.length},1fr);gap:10px;margin-top:14px">${arr.map(([k,v])=>`<div><div class="small mut">${k}</div><div style="font-weight:600;margin-top:2px">${v}</div></div>`).join('')}</div>`;
  return win({ icon: 'f0e4', title: 'System manager', tools: `<div class="tsearch"><i>${ico('f002')}</i>Search processes</div>`,
    side: nav([N('f009','Overview'), N('f03a','Processes','214'), N('f2db','CPU'), N('f233','Memory'), N('f0a0','Disks'), N('f1eb','Network'), N('f26c','GPU'), G('TuxOS'), N('f085','Services','dinit'), N('f135','Startup apps')], 'Overview'),
    main: `<div style="display:flex;align-items:baseline;gap:16px"><h1>Overview</h1><span class="mut">Up 3 h 12 min · 214 processes · 2 412 threads</span></div><div class="grid" style="grid-template-columns:1fr 1fr;margin-top:18px">
      <div style="grid-column:span 2">${card('f2db','Intel Core i7-14700K','20 cores, 28 threads · 5.32 GHz · 54 °C · 68 W · 1.21 V', graph(1120, 80, series(80, 25, 14, 3)) + kv([['Usage','23 %'],['Busiest core','P3 · 71 %'],['Load (1/5/15 min)','2.1 / 1.8 / 1.6'],['Game mode','ready']]))}</div>
      ${card('f233','Memory','DDR5 · 6000 MT/s · 2 × 16 GB · Kingston FURY Beast', graph(560, 64, series(50, 38, 6, 5)) + kv([['In use','11.8 GB'],['Cached','9.2 GB'],['Free','10.9 GB'],['zram','0.4 / 7.6 GB']]))}
      ${card('f0a0','Samsung 990 PRO 2 TB','NVMe · PCIe 4.0 x4 (max ≈ 7.9 GB/s) · health 100 % · 41 °C', graph(560, 64, series(50, 15, 26, 9), '#c4d6ff') + kv([['Read','412 MB/s'],['Write','36 MB/s'],['Used','812 / 1863 GB'],['Benchmark','Run']]))}
      ${card('f0e8','Ethernet','1 Gbit/s · enp5s0', graph(560, 64, series(50, 30, 30, 21)) + `<div style="display:flex;align-items:flex-end;gap:10px;margin-top:14px"><div style="flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px">${[['Download','12.4 MB/s'],['Upload','0.8 MB/s'],['Since start','↓ 3.2 GB · ↑ 0.4 GB']].map(([k,v])=>`<div><div class="small mut">${k}</div><div style="font-weight:600;margin-top:2px">${v}</div></div>`).join('')}</div><span class="btn p"><i>${ico('f0e4')}</i>Run speed test</span></div>`)}
      ${card('f26c','NVIDIA GeForce RTX 4070','12 GB GDDR6X · 466 AI TOPS · driver 580', graph(560, 64, series(50, 55, 22, 31), '#9be0c8') + kv([['Utilisation','61 %'],['Temperature','63 °C'],['Fan','1 420 rpm'],['Power','142 W']]))}
    </div>` });
};
// 4. System manager: processes + right-click -------------------------------------
A.procs = () => {
  const P = [['f0ac','Helium','12.4','2.1 GB','0.4 MB/s','3 %'],['f11b','Steam','4.1','910 MB','0.0','0 %'],['f121','Code editor','2.8','640 MB','0.0','1 %'],['f120','kitty','0.9','82 MB','0.0','0 %'],['f001','Spotify','1.6','410 MB','0.3 MB/s','0 %'],
