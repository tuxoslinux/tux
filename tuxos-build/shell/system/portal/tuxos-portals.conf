# The TuxOS desktop (XDG_CURRENT_DESKTOP=TuxOS:Hyprland): TuxOS Files picks
# files, Hyprland's portal shares the screen (with TuxOS' picker), GTK's the
# rest, GNOME Keyring the secrets
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.FileChooser=tuxos;gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
