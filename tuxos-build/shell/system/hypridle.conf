# TuxOS: lock the screen before the PC goes to sleep (lid closed, power
# key, menu). Locking after 5 minutes without input is done by the shell.
general {
    lock_cmd = qs -c tuxos ipc call shell call lock
    before_sleep_cmd = qs -c tuxos ipc call shell call lock; sleep 0.6
    after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms({ action = \"on\" })"
}
