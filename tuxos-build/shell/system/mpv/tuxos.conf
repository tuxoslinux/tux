# TuxOS Video player: mpv with the TuxOS look (the desktop file includes
# this; the user's own ~/.config/mpv/mpv.conf still applies on top).
# Hardware decoding where it is safe, resume where you stopped, subtitles
# found by name, screenshots to ~/Pictures/Screenshots.
hwdec=auto-safe
vo=gpu-next
keep-open=yes
save-position-on-quit=yes
sub-auto=fuzzy
screenshot-directory=~/Pictures/Screenshots
screenshot-format=png
osd-font="Adwaita Sans"
osd-font-size=34
osd-color="#f4f7fb"
osd-border-size=0
osd-shadow-offset=1
osd-bar-h=2.2
sub-font="Adwaita Sans"
title="${?media-title:${media-title}}${!media-title:Video player}"
# the on-screen controls: a slim bottom bar, TuxOS colours
script-opts-append=osc-layout=bottombar
script-opts-append=osc-seekbarstyle=bar
script-opts-append=osc-boxalpha=60
script-opts-append=osc-hidetimeout=1200
script-opts-append=osc-fadeduration=180
script-opts-append="osc-background_color=#0c0e13"
script-opts-append="osc-seekbarfg_color=#8fb8ff"
script-opts-append="osc-seekbarbg_color=#2a3140"
script-opts-append="osc-hover_effect_color=#8fb8ff"
script-opts-append="osc-timecode_color=#c9d1dc"
script-opts-append="osc-title_color=#f4f7fb"
script-opts-append="osc-buttons_color=#f4f7fb"
script-opts-append=osc-windowcontrols=no
