# TuxOS Game HUD (Super + Shift + G shows / hides it; mockup shell2/13-gamehud):
# one glass card, white text, the blue accent; FPS with 1 % and 0.1 % lows,
# frame time and its graph, CPU / GPU load and temperature, VRAM, RAM,
# power. Hidden until asked for. Every session is logged for the summary the
# shell shows when the game closes (~/.local/share/tuxos/gamelogs).
no_display
toggle_hud=Shift_L+F12
# the shell toggles it through this socket (mangohudctl)
control=mangohud
toggle_fps_limit=Shift_L+F1
position=top-left
offset_x=24
offset_y=24
round_corners=16
background_color=0c0e13
background_alpha=0.78
font_file=/usr/share/fonts/Adwaita/AdwaitaSans-Regular.ttf
font_size=20
font_size_text=15
text_color=f4f7fb
text_outline=0
table_columns=3
cellpadding_y=0.1
fps
fps_metrics=avg,0.01,0.001
fps_color_change=0
frametime
frame_timing
# the real tearing state: FIFO = V-Sync, MAILBOX, IMMEDIATE = tearing allowed
present_mode
frametime_color=8fb8ff
cpu_stats
cpu_temp
cpu_power
cpu_color=8fb8ff
gpu_stats
gpu_temp
gpu_power
gpu_color=8fb8ff
vram
vram_color=8fb8ff
ram
ram_color=8fb8ff
engine_color=8b95a5
vsync=-1
fps_limit=0
fps_limit_method=late
# logging for the game session summary
autostart_log=1
log_interval=1000
output_folder=$HOME/.local/share/tuxos/gamelogs
