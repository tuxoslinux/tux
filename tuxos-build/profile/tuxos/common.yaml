---
# Packages for every TuxOS image (artools common list without the Artix GRUB theme)

packages-base:
  - base
  - intel-ucode
  - amd-ucode
  - acpi
  - alsa-firmware
  - btrfs-progs
  - diffutils
  - dosfstools
  - efibootmgr
  - e2fsprogs
  - exfatprogs
  - f2fs-tools
  - grub
  - inetutils
  - iptables
  - linux-cachyos
  - linux-firmware
  - lsb-release
  - logrotate
  - man-db
  - man-pages
  - memtest86+
  - mkinitcpio
  - mkinitcpio-openswap
  - modemmanager
  - nano
  - net-tools
  - ntfs-3g
  - os-prober
  # os-prober mounts other systems with grub-mount, which needs fuse3:
  # without it GRUB never lists Windows or another Linux (dual boot)
  - fuse3
  - sudo
  - sysfsutils
  - usbutils
  - vi
  - which
  - xfsprogs
  - zsh
packages-apps:
  - powertop
  - inxi
packages-xorg:
  - xorg-server
  - xf86-input-wacom
  - xf86-video-amdgpu
  - xf86-video-ati
  - xf86-video-fbdev
  - xf86-video-vesa
packages-xlibre:
  - xlibre-xserver
  - xlibre-xf86-input-vmmouse
  - xlibre-xf86-input-wacom
  - xlibre-xf86-video-amdgpu
  - xlibre-xf86-video-ati
  - xlibre-xf86-video-dummy
  - xlibre-xf86-video-fbdev
  - xlibre-xf86-video-intel
  - xlibre-xf86-video-nouveau
  - xlibre-xf86-video-sisusb
  - xlibre-xf86-video-qxl
  - xlibre-xf86-video-vesa
  - xlibre-xf86-video-voodoo
packages-misc:
  - xorg-xhost
  - xorg-xinit
  - xdg-user-dirs
  - xdg-utils
  - wayland
  - xorg-xwayland
  - terminus-font
  - ttf-inconsolata
  - ttf-liberation
  - ttf-roboto
  - ttf-roboto-mono
  # - vkd3d
  # - vulkan-intel
  # - vulkan-radeon
  # - vulkan-swrast
  # - mesa-vdpau
  # - libva-mesa-driver
  # - libva-intel-driver
  # - gst-plugins-good
  # - gst-plugins-bad
  # - gst-plugins-ugly
  # - gst-libav
packages-init:
  dinit:
    - blocaled
    - elogind-dinit
    - dbus-dinit
    - avahi-dinit
    - bluez-dinit
    - cronie-dinit
    - chrony-dinit
    - cryptsetup-dinit
    - lvm2-dinit
    - mdadm-dinit
    - openssh-dinit
    - power-profiles-daemon-dinit
    - wpa_supplicant-dinit
  openrc:
    - openrc-settingsd
    - elogind-openrc
    - dbus-openrc
    - acpid-openrc
    - avahi-openrc
    - bluez-openrc
    - cronie-openrc
    - cryptsetup-openrc
    - dhcpcd-openrc
    - haveged-openrc
    - lvm2-openrc
    - mdadm-openrc
    - nfs-utils-openrc
    - ntp-openrc
    - openssh-openrc
    - power-profiles-daemon-openrc
    - rsync-openrc
    - wpa_supplicant-openrc
  runit:
    - blocaled
    - rsm
    - elogind-runit
    - dbus-runit
    - acpid-runit
    - avahi-runit
    - bluez-runit
    - cronie-runit
    - cryptsetup-runit
    - dhcpcd-runit
    - haveged-runit
    - lvm2-runit
    - mdadm-runit
    - nfs-utils-runit
    - ntp-runit
    - openssh-runit
    - power-profiles-daemon-runit
