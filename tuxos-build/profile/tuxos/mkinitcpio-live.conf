# Initramfs of the TuxOS live ISO: artools' mkinitcpio-default.conf (no
# boot animation) plus tuxos_no_nouveau.
MODULES=(loop dm-snapshot)

HOOKS=(base udev artix_shutdown artix artix_loop_mnt artix_kms
        tuxos_no_nouveau modconf block filesystems keyboard keymap)

COMPRESSION="zstd"

COMPRESSION_OPTIONS=(--ultra -22)
