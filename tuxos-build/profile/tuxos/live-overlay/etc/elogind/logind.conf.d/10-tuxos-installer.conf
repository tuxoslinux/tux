# TuxOS live installer: closing a laptop's lid or pressing a sleep key must
# not suspend the computer in the middle of an installation (the installer
# asks for that through a power manager the live session does not run).
# Installed systems keep elogind's defaults.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
