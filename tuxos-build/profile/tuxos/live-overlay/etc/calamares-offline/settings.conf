---
modules-search: [ local ]

# TuxOS "Desktop" and "Drivers" pages and the jobs that install the choices
instances:
    - id: desktop
      module: packagechooser
      config: packagechooser_desktop.conf
    - id: desktop
      module: shellprocess
      config: shellprocess_desktop.conf
    - id: drivers
      module: packagechooser
      config: packagechooser_drivers.conf
    - id: drivers
      module: shellprocess
      config: shellprocess_drivers.conf
    - id: gaming
      module: packagechooser
      config: packagechooser_gaming.conf
    - id: gaming
      module: shellprocess
      config: shellprocess_gaming.conf

sequence:
    - show:
        - welcome
        - locale
        - keyboard
        - packagechooser@desktop
        - packagechooser@drivers
        - packagechooser@gaming
        - partition
        - users
        - summary
    - exec:
        - partition
        - mount
        - unpackfs
        - machineid
        - fstab
        - locale
        - keyboard
        - localecfg
        - shellprocess@desktop
        - shellprocess@drivers
        - shellprocess@gaming
        - luksopenswaphookcfg
        - luksbootkeyfile
        - initcpiocfg
        - initcpio
        - users
        - networkcfg
        - hwclock
        - services-artix
        - grubcfg
        - bootloader
        - postcfg
        # keep the installer's log on the new system (/var/log/Calamares.log)
        - preservefiles
        - umount
    - show:
        - finished

branding: tuxos

prompt-install: false

dont-chroot: false

oem-setup: false

disable-cancel: false

disable-cancel-during-exec: false

hide-back-and-next-during-exec: false

quit-at-end: false
