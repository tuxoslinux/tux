---
# The installer runs without a web browser, so link buttons are hidden.
showSupportUrl:         false
showKnownIssuesUrl:     false
showReleaseNotesUrl:    false

requirements:
    requiredStorage:    12.0
    requiredRam:        1.0
    internetCheckUrl:   https://github.com
    check:
      - storage
      - ram
      - power
      - internet
      - root
    # online installer: the desktop and the drivers are downloaded
    required:
      - storage
      - ram
      - internet
      - root
