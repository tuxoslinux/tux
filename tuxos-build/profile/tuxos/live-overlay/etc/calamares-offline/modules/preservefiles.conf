# TuxOS: keep the installer's log and settings in /var/log only. (Artix'
# default also put a root-only copy in the new user's home, which their
# own tools - backups, file search - then cannot read.)
---
files:
  - from: log
    dest: /var/log/Calamares.log
    perm: root:wheel:600
  - from: config
    dest: /var/log/Calamares-install.json
    perm: root:wheel:600
