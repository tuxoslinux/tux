---
# "Desktop" page: which desktop the new system gets. The choice is stored
# in Global Storage as packagechooser_desktop and installed by
# shellprocess@desktop (/usr/lib/tuxos/install-desktop), downloaded from
# the TuxOS package repositories.
mode: required
method: legacy

labels:
    step: "Desktop"

default: plasma

items:
    - id: plasma
      name: "KDE Plasma"
      description: "A modern, polished desktop that you can customize in every detail. Includes Dolphin, Konsole, Kate, Okular, Gwenview, Ark and Firefox."
      screenshot: "desktop-plasma.png"
    - id: cosmic
      name: "COSMIC"
      description: "System76's new Wayland desktop, fast and written in Rust, with a top panel, a dock and optional tiling. Includes COSMIC Files, Terminal, Text Editor, Image Viewer, Media Player and Firefox."
      screenshot: "desktop-cosmic.png"
    - id: hyprland
      name: "Hyprland"
      description: "A dynamic tiling Wayland compositor with smooth animations, for keyboard-driven work. Includes Waybar, Wofi, foot, Thunar and Firefox. Press Super+Enter for a terminal and Super+D for apps."
      screenshot: "desktop-hyprland.png"
    - id: cinnamon
      name: "Cinnamon"
      description: "A traditional, friendly desktop with a familiar panel and start menu. Includes Nemo, GNOME Terminal, Xed, Xreader and Firefox."
      screenshot: "desktop-cinnamon.png"
    - id: budgie
      name: "Budgie"
      description: "An elegant, simple desktop with a panel and the Raven side bar for notifications and settings, running on Wayland. Includes Nemo, GNOME Terminal, Text Editor, Image Viewer, Document Viewer and Firefox."
      screenshot: "desktop-budgie.png"
    - id: mate
      name: "MATE"
      description: "The classic desktop that continues GNOME 2: two panels, menus and a traditional layout. Includes Caja, MATE Terminal, Pluma, Atril, Eye of MATE and Firefox."
      screenshot: "desktop-mate.png"
    - id: lxqt
      name: "LXQt"
      description: "A lightweight Qt desktop that runs well even on older computers. Includes PCManFM-Qt, QTerminal, FeatherPad and Firefox."
      screenshot: "desktop-lxqt.png"
    - id: labwc
      name: "Labwc"
      description: "A simple and fast stacking Wayland compositor in the style of Openbox. Right-click the desktop for the menu. Includes Waybar, Wofi, foot, Thunar and Firefox."
      screenshot: "desktop-labwc.png"
    - id: xfce
      name: "XFCE"
      description: "A light, fast and dependable desktop that stays out of your way. Includes Thunar, Xfce Terminal, Mousepad, Ristretto and Firefox."
      screenshot: "desktop-xfce.png"
    - id: i3
      name: "i3"
      description: "A keyboard-driven tiling window manager for X11. Includes i3status, dmenu, Alacritty, Thunar and Firefox. Press Super+Enter for a terminal and Super+D for apps."
      screenshot: "desktop-i3.png"
    - id: console
      name: "No desktop"
      description: "A text console only, for servers or for setting things up yourself. You can install a desktop later with pacman."
      screenshot: "desktop-console.png"
