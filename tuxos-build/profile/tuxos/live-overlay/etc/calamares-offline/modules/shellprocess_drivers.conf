---
# Installs the drivers picked on the "Drivers" page (see
# packagechooser_drivers.conf) with tuxos-drivers. Runs on the live system.
# The leading "-" keeps a failed download from stopping the installation:
# the open-source drivers stay in use and tuxos-drivers can run later.
dontChroot: true
timeout: 7200
verbose: true
script:
    - "-/usr/bin/tuxos-drivers --root ${ROOT} --mode '${gs[packagechooser_drivers]}'"
i18n:
    name: "Installing the drivers"
