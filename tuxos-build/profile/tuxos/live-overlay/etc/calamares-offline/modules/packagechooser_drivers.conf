---
# "Drivers" page. This copy is a fallback: "Install TuxOS"
# (/usr/lib/tuxos/run-installer) replaces it with one describing the
# detected hardware (tuxos-drivers --calamares-conf). The choice is
# stored as packagechooser_drivers and installed by shellprocess@drivers.
mode: required
method: legacy
labels:
    step: "Drivers"
default: recommended
items:
    - id: recommended
      name: "Recommended drivers"
      description: "TuxOS detects your graphics card, Wi-Fi card and virtual machine and installs the best official drivers for them. They are downloaded during the installation, so the computer needs an internet connection. Without one, TuxOS uses its open-source drivers and you can run <code>sudo tuxos-drivers</code> later."
      screenshot: "desktop-drivers-recommended.png"
    - id: opensource
      name: "Open-source drivers only"
      description: "Use only open-source drivers (Mesa, nouveau). They are already part of TuxOS. Pick this if you prefer free software or have trouble with NVIDIA's driver."
      screenshot: "desktop-drivers-opensource.png"
