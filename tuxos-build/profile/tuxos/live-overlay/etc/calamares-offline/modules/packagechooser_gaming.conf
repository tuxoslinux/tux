---
# "Gaming" page: whether the new system gets the gaming apps. The choice is
# stored in Global Storage as packagechooser_gaming and installed by
# shellprocess@gaming (tuxos-gaming). The gaming tuning (automatic game
# mode, schedulers, zram, ...) is part of every install either way.
mode: required
method: legacy

labels:
    step: "Gaming"

default: "yes"

items:
    - id: "yes"
      name: "Ready to play"
      description: "Installs Steam, Proton-CachyOS (with FSR 4 and NTSYNC), umu and ProtonPlus for games from other stores, the MangoHud FPS overlay, gamemode and gamescope, and the 32-bit graphics drivers games need. They are downloaded during the installation (about 1 GB). TuxOS switches into game mode by itself whenever a game runs: no launch options needed."
      screenshot: "desktop-gaming-yes.png"
    - id: "no"
      name: "No gaming apps"
      description: "Skip the gaming apps. The system tuning for games is part of TuxOS either way, and you can add the apps later with <code>sudo tuxos-gaming</code>."
      screenshot: "desktop-gaming-no.png"
