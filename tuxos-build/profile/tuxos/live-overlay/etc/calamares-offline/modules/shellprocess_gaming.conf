---
# Installs the gaming apps chosen on the "Gaming" page (tuxos-gaming). A
# failed download does not stop the installation: tuxos-gaming can be run
# again later.
dontChroot: true
timeout: 7200
verbose: true
script:
    - "-/usr/bin/tuxos-gaming --root ${ROOT} --mode '${gs[packagechooser_gaming]}'"
i18n:
    name: "Installing the gaming apps"
