---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - lp
    - video
    - network
    - storage
    - name: wheel
      must_exist: false
      system: true
    - audio
    - power
    - log
    - optical
    - network
    - scanner
    # gamemode may renice games (created now if the gaming apps come later)
    - name: gamemode
      must_exist: false
      system: true

autologinGroup: autologin

doAutologin:     false

sudoersGroup:    wheel

setRootPassword: true

doReusePassword: false

passwordRequirements:
    minLength: 4  # Password at least this many characters
    maxLength: -1  # Password at most this many characters
    libpwquality:
        - minlen=4
        - minclass=0

allowWeakPasswords: true
allowWeakPasswordsDefault: true

userShell: /bin/bash

setHostname: EtcFile

writeHostsFile: true

user:
  shell: /bin/bash
  forbidden_names: [ root ]
