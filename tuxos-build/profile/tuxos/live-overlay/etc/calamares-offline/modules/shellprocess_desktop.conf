---
# Installs the desktop chosen on the "Desktop" page (see
# packagechooser_desktop.conf). Runs on the live system.
dontChroot: true
timeout: 7200
verbose: true
script:
    - "/usr/lib/tuxos/install-desktop ${ROOT} '${gs[packagechooser_desktop]}' '${USER}'"
i18n:
    name: "Installing the desktop"
