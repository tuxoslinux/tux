# TuxOS Hyprland configuration
# Full reference: https://wiki.hypr.land/Configuring/

monitor = , preferred, auto, 1

$terminal = foot
$fileManager = thunar
$menu = wofi --show drun
$browser = firefox

exec-once = swaybg -m fill -i /usr/share/backgrounds/tuxos/tuxos-wallpaper.jpg
exec-once = /usr/lib/tuxos/with-session-bus waybar
exec-once = /usr/lib/tuxos/with-session-bus mako
exec-once = /usr/lib/tuxos/with-session-bus /usr/lib/hyprpolkitagent/hyprpolkitagent
exec-once = /usr/lib/tuxos/with-session-bus nm-applet --indicator
exec-once = /usr/lib/tuxos/with-session-bus blueman-applet
exec-once = xdg-user-dirs-update
exec-once = /usr/lib/tuxos/with-session-bus notify-send -t 15000 "Welcome to TuxOS" "Super+Enter: terminal\nSuper+D: apps\nSuper+E: files\nSuper+B: browser\nSuper+Q: close window\nSuper+Shift+E: log out"

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb

input {
    kb_layout = us
    kb_variant =
    follow_mouse = 1
    touchpad {
        natural_scroll = false
    }
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgb(f5b800)
    col.inactive_border = rgb(333333)
    layout = dwindle
}

decoration {
    rounding = 8
}

animations {
    enabled = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

$mod = SUPER

bind = $mod, Return, exec, $terminal
bind = $mod, D, exec, $menu
bind = $mod, E, exec, $fileManager
bind = $mod, B, exec, $browser
bind = $mod, Q, killactive,
bind = $mod SHIFT, E, exit,
bind = $mod, V, togglefloating,
bind = $mod, F, fullscreen,
bind = , Print, exec, grim "$HOME/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png"

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
