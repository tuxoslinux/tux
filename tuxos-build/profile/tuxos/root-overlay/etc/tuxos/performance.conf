# TuxOS performance settings. Read by tuxos-gamed, the zram service and
# tuxos-tune; `tuxos-tune status` shows what is active.

# Game mode: tuxos-gamed notices running games (Steam, Proton, umu/Lutris/
# Heroic, gamescope) and switches the system into game mode until they end.
GAME_MODE=yes
# CPU scheduler while a game runs. "none" keeps the kernel's BORE
# scheduler, the default: in TuxOS' benchmark (a 144 Hz frame timer under
# full CPU load) BORE kept frames on time (99th percentile 55 us) where the
# sched-ext schedulers did not (scx_bpfland ~2.7 ms, scx_lavd ~4.5 ms). To
# try one with your games anyway: GAME_SCHEDULER=scx_lavd or scx_bpfland,
# with GAME_SCHEDULER_MODE=gaming, lowlatency or auto.
GAME_SCHEDULER=none
GAME_SCHEDULER_MODE=gaming
# power-profiles-daemon profile while a game runs (where the computer offers it)
GAME_POWER_PROFILE=performance
# desktop PCs (no battery): this profile from the first boot on, for the
# lowest latency everywhere (set once; the power settings can change it).
# Empty: leave the default ("balanced").
DESKTOP_POWER_PROFILE=performance

# desktop PCs (no battery): "no" keeps NVMe drives out of their deep idle
# states (no wake-up hitches when a game loads data; a watt or two more).
# "yes": the drive's own power saving, as on laptops.
DESKTOP_NVME_POWER_SAVING=no

# zram: compressed swap in RAM. lz4 makes every swapped-in page fast; pages
# nobody touched for an hour are compressed again with zstd (smaller).
ZRAM=yes
ZRAM_ALGORITHM=lz4
ZRAM_RECOMPRESS_ALGORITHM=zstd
# largest amount of memory zram may hold, in percent of the RAM
ZRAM_SIZE_PERCENT=100
