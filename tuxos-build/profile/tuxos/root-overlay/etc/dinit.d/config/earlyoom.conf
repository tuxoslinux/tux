# earlyoom (TuxOS): when RAM and swap are both nearly full, end the biggest
# program before the whole system freezes. Never the desktop, sound or
# session; browser tabs go first. The service expands this unquoted: no
# spaces or quotes inside the patterns.
EARLYOOM_ARGS="-r 0 -m 5 -s 10 --avoid (^|/)(dinit|Xorg|Xwayland|kwin_wayland|kwin_x11|plasmashell|sddm|sddm-helper|pipewire|pipewire-pulse|wireplumber|dbus-daemon|elogind-daemon|sshd)$ --prefer (^|/)(Web.Content|Isolated.Web.Co|chrome|chromium|electron)$"
