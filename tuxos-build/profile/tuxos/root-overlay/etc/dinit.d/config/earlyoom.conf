# earlyoom (TuxOS): when RAM and swap are both nearly full, end the biggest
# program before the whole system freezes. Never the desktop (compositor,
# panel, TuxOS shell), sound or session; browser tabs go first. The
# service expands this unquoted: no spaces or quotes inside the patterns.
EARLYOOM_ARGS="-r 0 -m 5 -s 10 --avoid (^|/)(dinit|Xorg|Xwayland|kwin_wayland|kwin_x11|plasmashell|sddm|sddm-helper|greetd|cage|Hyprland|qs|quickshell|cosmic-comp|cosmic-panel|cinnamon|muffin|budgie-wm|budgie-panel|marco|mate-panel|xfwm4|xfce4-panel|labwc|lxqt-panel|openbox|i3|pipewire|pipewire-pulse|wireplumber|dbus-daemon|elogind-daemon|sshd)$ --prefer (^|/)(Web.Content|Isolated.Web.Co|chrome|chromium|electron)$"
