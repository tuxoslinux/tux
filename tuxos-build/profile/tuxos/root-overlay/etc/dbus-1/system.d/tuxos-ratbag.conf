<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- TuxOS: the desktop user (wheel) may set up gaming mice in Settings >
     Mouse & touchpad (libratbag's own policy only allows the input group) -->
<busconfig>
  <policy group="wheel">
    <allow send_destination="org.freedesktop.ratbag1"/>
    <allow receive_sender="org.freedesktop.ratbag1"/>
  </policy>
</busconfig>
