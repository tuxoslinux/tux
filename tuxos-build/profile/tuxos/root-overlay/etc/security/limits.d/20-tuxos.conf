# TuxOS limits
# audio programs (PipeWire through rtkit) may use realtime priority
@audio - rtprio 99
@audio - nice -11
# Wine/Proton's esync needs many open files (programs raise their own soft
# limit up to this). Never above the kernel's fs.nr_open (1048576 without
# systemd): pam_limits would then refuse every login.
* hard nofile 1048576
