# TuxOS laptops: closing the lid locks and sleeps (the desktop locks the
# screen before sleep); plugged in with an external screen it does nothing,
# so a closed laptop can drive its monitor
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
# the power key opens TuxOS' power menu instead of turning the PC off
HandlePowerKey=ignore
