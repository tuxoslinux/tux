# TuxOS kernel settings for low latency and games. Override any of them in
# /etc/sysctl.d/.

## Memory
# zram swap (see /usr/lib/tuxos/zram-setup, which raises this to 150 once
# zram is on): swapping to RAM is cheap, so keep the page cache instead
vm.swappiness = 100
vm.page-cluster = 0
# keep directory and inode caches longer (faster file lookups)
vm.vfs_cache_pressure = 50
# write dirty data early and in small amounts: no long stalls when a game
# or Steam writes a lot at once
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
vm.dirty_writeback_centisecs = 1500
# games with many memory mappings (SteamOS value; some Proton titles crash
# with the default)
vm.max_map_count = 2147483642
# no background memory compaction while playing (compaction stalls)
vm.compaction_proactiveness = 0
# no reclaim bursts after memory gets fragmented (the kernel would otherwise
# throw out page cache in a burst, then read it back: hitches). The kernel's
# default free-memory reserve stays: raising it (watermark_scale_factor=125,
# as Pop!_OS does) kept about 100 MiB more RAM out of use on a 4 GiB test
# machine, more on bigger ones, with no gain TuxOS' tests could measure.
vm.watermark_boost_factor = 0
# memory statistics every 10 s instead of every second: fewer timer
# wakeups on every CPU
vm.stat_interval = 10

## CPU
# The leading "-" lets sysctl skip a key this CPU or a virtual machine does
# not have (an NMI watchdog cannot be changed in KVM: error 524), instead of
# failing the whole sysctl service.
# split-lock detection otherwise slows a whole program down on purpose
# (10 ms penalty) when it uses split locks, which several games do (the
# kernel command line also turns detection off: split_lock_detect=off;
# this covers kernels started without it)
-kernel.split_lock_mitigate = 0
# no NMI watchdog: fewer interrupts on every CPU
-kernel.nmi_watchdog = 0

## Kernel
# containers without root (Steam's runtime, Flatpak)
kernel.unprivileged_userns_clone = 1
# no kernel messages over the screen
kernel.printk = 3 3 3 3
kernel.kptr_restrict = 2
# SysRq for recovering a hung system (Alt+SysRq+REISUB)
kernel.sysrq = 1
fs.file-max = 2097152

## Network
# BBR with fair queueing: higher throughput and less queueing delay
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_slow_start_after_idle = 0
net.core.netdev_max_backlog = 4096
# TCP windows up to 16 MiB: full download speed (Steam, game updates) on
# fast or distant connections; the kernel still sizes each one by itself
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
