# TuxOS memory settings applied at boot

# Transparent huge pages: only defragment for programs that ask for them
# (no stalls elsewhere), and split huge pages that are mostly empty
w /sys/kernel/mm/transparent_hugepage/defrag - - - - defer+madvise
w /sys/kernel/mm/transparent_hugepage/khugepaged/max_ptes_none - - - - 409

# Multi-gen LRU: never evict memory used within the last second, so a
# game's working set is not thrown out under memory pressure (stutter)
w /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 1000
