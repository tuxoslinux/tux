# TuxOS driver options

# AMD GCN 1.0/2.0 cards (Southern/Sea Islands): the modern amdgpu driver
# (Vulkan/RADV) instead of radeon
options amdgpu si_support=1 cik_support=1
options radeon si_support=0 cik_support=0

# NVIDIA: skip clearing new GPU memory allocations in system RAM (faster
# allocations) and use the CPU's page attribute table (faster mappings)
options nvidia NVreg_InitializeSystemMemoryAllocations=0 NVreg_UsePageAttributeTable=1

# no hardware watchdogs (the kernel's are off too: nowatchdog)
blacklist iTCO_wdt
blacklist sp5100_tco
blacklist wdat_wdt
