---
# TuxOS live ISO.
# rootfs  = the base system Calamares installs (same package set as build2).
# livefs  = live-only layer: the TuxOS desktop (Hyprland + the TuxOS
#           shell; greetd logs the live user in) and Calamares, started as
#           "Install TuxOS". The
#           desktops offered on the "Desktop" page are downloaded during
#           the installation (lists in live-overlay/usr/share/tuxos/desktop/
#           packages/).

live-session:
  user: tuxos
  password: tuxos
  autologin: true
  use-xlibre: false
  # Enabled in the live system and, through the installer, in installed
  # ones. Bluetooth is enabled by tuxos-tune setup only on computers with
  # Bluetooth; no acpid (elogind and the desktops handle ACPI events).
  services:
    - chronyd
    - cronie
    - cupsd
    - metalog
    - NetworkManager
  # Desktop user services (PipeWire) are linked into /etc/skel by
  # /usr/lib/tuxos/install-desktop; the stock postcfg module cannot do it.
  user-services:
    - dbus
rootfs:
  packages:
    # Arch [extra]/[multilib] and CachyOS support (see /etc/pacman.conf)
    - artix-archlinux-support
    - cachyos-keyring
    - cachyos-mirrorlist
    - yay
    # the fastest mirrors, ranked monthly (tuxos-mirrors)
    - rate-mirrors
    # Secure Boot status and signing (tuxos-secureboot; shim-signed comes when it is set up)
    - mokutil
    - sbsigntools
    - fastfetch
    # performance layer (/etc/tuxos/performance.conf): process priorities,
    # sched-ext CPU schedulers for game mode, PCI and disk tweaks
    - ananicy-cpp
    - cachyos-ananicy-rules
    - scx-scheds
    - scx-tools
    - pciutils
    - hdparm
    # stops the biggest program before the system freezes without memory
    - earlyoom
    # fast initramfs compression (/etc/mkinitcpio.conf.d/20-tuxos-boot.conf)
    - lz4
    # the installer copies the system with rsync (unpackfs); it used to come
    # only with rsync-dinit
    - rsync
  packages-init:
    dinit:
      - dinit-user-spawn
      - earlyoom-dinit
      # system log: metalog (about 1 MB of RAM; syslog-ng took 24 MB)
      - metalog-dinit
      - networkmanager-dinit
      - cups-dinit
livefs:
  packages:
    - artix-grub-live
    - mkinitcpio-nfs-utils
    - squashfs-tools
    - calamares
    - calamares-extensions
    - breeze
    - breeze-icons
    # live desktop: the TuxOS desktop itself (Hyprland + the TuxOS shell,
    # usr/share/tuxos/desktop/tuxos/root copied in by customize-livefs.sh);
    # greetd logs the live user in, the installer opens maximized under
    # the bar (its Wi-Fi panel stays usable for this online installer)
    - hyprland
    - quickshell
    - xdg-desktop-portal-hyprland
    - qt6-wayland
    - greetd
    - cage
    - kitty
    - wl-clipboard
    - grim
    - slurp
    - jq
    - curl
    - libnotify
    - upower
    - brightnessctl
    - adwaita-fonts
    - ttf-jetbrains-mono-nerd
    - syntax-highlighting
    - poppler
  packages-init:
    dinit:
      - artix-live-dinit
      - greetd-dinit
